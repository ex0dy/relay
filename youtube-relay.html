<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --blur-val: 45px;
        --sat-val: 2.5;
        --glow-opacity: 0.9;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      .ambient-box {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* Фоновый слой живого кадрового свечения (точно как в working.html) */
      .glow-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        filter: blur(var(--blur-val, 45px)) saturate(var(--sat-val, 2.5)) brightness(1.1);
        transform: scale(1.06);
        opacity: var(--glow-opacity, 0.9);
        pointer-events: none;
        transition: filter 0.15s ease, opacity 0.25s ease;
      }

      .glow-layer.pulsing {
        animation: backlight-pulse 3.5s ease-in-out infinite alternate;
      }

      @keyframes backlight-pulse {
        0% {
          transform: scale(0.98);
          opacity: calc(var(--glow-opacity, 0.9) * 0.7);
          filter: blur(calc(var(--blur-val, 45px) * 0.85)) saturate(calc(var(--sat-val, 2.5) * 0.85));
        }
        100% {
          transform: scale(1.12);
          opacity: var(--glow-opacity, 0.9);
          filter: blur(calc(var(--blur-val, 45px) * 1.3)) saturate(calc(var(--sat-val, 2.5) * 1.3));
        }
      }

      /* Основной плеер на весь размер фрейма */
      .main-layer {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        border: none;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="ambient-box">
      <div id="glow-player" class="glow-layer"></div>
      <div id="main-player" class="main-layer"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      const params = new URLSearchParams(location.search);
      let currentId = params.get("id") || params.get("v") || "gqvBoFpgXQA";
      const initBlur = params.get("blur");
      const initSat = params.get("sat");
      const initOpacity = params.get("opacity");
      const initPulse = params.get("pulse");

      if (initBlur) document.documentElement.style.setProperty("--blur-val", `${initBlur}px`);
      if (initSat) document.documentElement.style.setProperty("--sat-val", initSat);
      if (initOpacity !== null && initOpacity !== undefined) {
        document.documentElement.style.setProperty("--glow-opacity", initOpacity);
      }
      if (initPulse === "1" || initPulse === "true") {
        document.querySelectorAll(".glow-layer").forEach(el => el.classList.add("pulsing"));
      }

      let mainPlayer = null;
      let glowPlayer = null;

      function onYouTubeIframeAPIReady() {
        // 1. Фоновый плеер для генерации свечения (muted)
        glowPlayer = new YT.Player("glow-player", {
          videoId: currentId,
          playerVars: {
            controls: 0,
            disablekb: 1,
            modestbranding: 1,
            rel: 0,
            fs: 0
          },
          events: {
            onReady: (e) => {
              e.target.mute();
            }
          }
        });

        // 2. Основной интерактивный плеер
        mainPlayer = new YT.Player("main-player", {
          videoId: currentId,
          playerVars: {
            controls: 1,
            rel: 0
          },
          events: {
            onStateChange: onPlayerStateChange
          }
        });
      }

      function onPlayerStateChange(event) {
        if (!glowPlayer || !glowPlayer.seekTo) return;

        // Мгновенно синхронизируем таймлайн
        glowPlayer.seekTo(mainPlayer.getCurrentTime(), true);

        if (event.data === YT.PlayerState.PLAYING) {
          glowPlayer.playVideo();
        } else if (event.data === YT.PlayerState.PAUSED) {
          glowPlayer.pauseVideo();
        } else if (event.data === YT.PlayerState.BUFFERING) {
          glowPlayer.pauseVideo();
        }
      }

      // Непрерывная синхронизация кадров
      setInterval(() => {
        if (
          mainPlayer &&
          glowPlayer &&
          mainPlayer.getPlayerState &&
          mainPlayer.getPlayerState() === YT.PlayerState.PLAYING
        ) {
          const diff = Math.abs(
            mainPlayer.getCurrentTime() - glowPlayer.getCurrentTime()
          );
          if (diff > 0.2) {
            glowPlayer.seekTo(mainPlayer.getCurrentTime(), true);
          }
        }
      }, 500);

      // Прием сообщений от родительского окна (настройки + смена видео)
      window.addEventListener("message", (e) => {
        if (!e.data) return;
        if (e.data.type === "loadVideo" && e.data.videoId) {
          currentId = e.data.videoId;
          if (mainPlayer?.loadVideoById && glowPlayer?.loadVideoById) {
            mainPlayer.loadVideoById(currentId);
            glowPlayer.loadVideoById(currentId);
            glowPlayer.mute();
          }
        } else if (e.data.type === "updateSettings") {
          if (e.data.blur !== undefined) {
            document.documentElement.style.setProperty("--blur-val", `${e.data.blur}px`);
          }
          if (e.data.sat !== undefined) {
            document.documentElement.style.setProperty("--sat-val", e.data.sat);
          }
          if (e.data.opacity !== undefined) {
            document.documentElement.style.setProperty("--glow-opacity", e.data.opacity);
          }
          if (e.data.pulse !== undefined) {
            document.querySelectorAll(".glow-layer").forEach(el => el.classList.toggle("pulsing", !!e.data.pulse));
          }
        }
      });
    </script>
  </body>
</html>
